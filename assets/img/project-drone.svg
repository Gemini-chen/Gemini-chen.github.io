<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="四旋翼无人机飞控协同系统技术示意图">
  <defs>
    <pattern id="g1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dfe6f1" stroke-width="1"/>
    </pattern>
    <pattern id="g2" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ccd8ea" stroke-width="1"/>
    </pattern>
    <style>
      .lbl{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#5a6a80;letter-spacing:.04em}
      .key{font-family:Consolas,Menlo,monospace;font-size:14px;fill:#0b1016;letter-spacing:.06em}
      .tiny{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#8c9bb0;letter-spacing:.12em}
      .ln{fill:none;stroke:#c6d2e3;stroke-width:1.2}
      .acc{fill:none;stroke:#1a5cff;stroke-width:1.6}
      .dash{fill:none;stroke:#1a5cff;stroke-width:1.5;stroke-dasharray:7 6}
      .solid{fill:#fff;stroke:#0b1016;stroke-width:2}
    </style>
  </defs>

  <rect width="1000" height="620" fill="#f7f9fc"/>
  <rect width="1000" height="620" fill="url(#g1)"/>
  <rect width="1000" height="620" fill="url(#g2)"/>

  <!-- header -->
  <text class="key" x="40" y="42">FIG.01 / QUADROTOR FLIGHT CONTROL</text>
  <text class="tiny" x="960" y="42" text-anchor="end">REV. 2025.04 · STM32F103C8T6</text>
  <line class="ln" x1="40" y1="58" x2="960" y2="58"/>
  <g class="ln" stroke="#1a5cff">
    <path d="M40 30v-12h12"/><path d="M960 30v-12h-12"/>
  </g>

  <!-- remote controller -->
  <rect class="solid" x="60" y="400" width="176" height="128" rx="18"/>
  <rect x="76" y="416" width="144" height="96" rx="12" fill="#f2f6fd" stroke="#dbe4f1" stroke-width="1.2"/>
  <circle cx="116" cy="462" r="24" fill="#fff" stroke="#0b1016" stroke-width="1.8"/>
  <circle cx="116" cy="462" r="7" fill="#1a5cff"/>
  <circle cx="200" cy="462" r="24" fill="#fff" stroke="#0b1016" stroke-width="1.8"/>
  <circle cx="200" cy="462" r="7" fill="#1a5cff"/>
  <rect x="112" y="496" width="92" height="6" rx="3" fill="#d8e2f0"/>
  <text class="tiny" x="148" y="546" text-anchor="middle">REMOTE / HANDHELD</text>
  <text class="lbl" x="60" y="386">ADC 霍尔摇杆 + 数字滤波</text>
  <line class="ln" x1="148" y1="392" x2="148" y2="400"/>

  <!-- wireless arcs -->
  <path class="dash" d="M244 424 Q330 330 448 292"/>
  <path class="dash" d="M244 452 Q340 372 452 322" opacity=".62"/>
  <path class="dash" d="M244 480 Q350 414 456 352" opacity=".32"/>
  <text class="lbl" x="268" y="326">SPI → nRF24L01 / 2.4GHz</text>
  <circle cx="252" cy="452" r="4" fill="#1a5cff"/>

  <!-- arms -->
  <g stroke="#dbe4f1" stroke-width="18" stroke-linecap="round">
    <path d="M560 310L390 150"/><path d="M560 310L730 150"/>
    <path d="M560 310L390 470"/><path d="M560 310L730 470"/>
  </g>
  <g class="acc" opacity=".55">
    <path d="M560 310L390 150"/><path d="M560 310L730 150"/>
    <path d="M560 310L390 470"/><path d="M560 310L730 470"/>
  </g>

  <!-- motors -->
  <g>
    <g transform="translate(390,150)">
      <circle r="70" class="dash" opacity=".5"/>
      <circle r="44" class="solid"/>
      <circle r="9" fill="#1a5cff"/>
      <ellipse rx="60" ry="7" fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.4" transform="rotate(28)"/>
      <ellipse rx="60" ry="7" fill="#fff" stroke="#1a5cff" stroke-width="1.4" transform="rotate(-28)"/>
      <circle r="5" fill="#0b1016"/>
    </g>
    <g transform="translate(730,150)">
      <circle r="70" class="dash" opacity=".5"/>
      <circle r="44" class="solid"/>
      <circle r="9" fill="#1a5cff"/>
      <ellipse rx="60" ry="7" fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.4" transform="rotate(-28)"/>
      <ellipse rx="60" ry="7" fill="#fff" stroke="#1a5cff" stroke-width="1.4" transform="rotate(28)"/>
      <circle r="5" fill="#0b1016"/>
    </g>
    <g transform="translate(390,470)">
      <circle r="70" class="dash" opacity=".5"/>
      <circle r="44" class="solid"/>
      <circle r="9" fill="#1a5cff"/>
      <ellipse rx="60" ry="7" fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.4" transform="rotate(-28)"/>
      <ellipse rx="60" ry="7" fill="#fff" stroke="#1a5cff" stroke-width="1.4" transform="rotate(28)"/>
      <circle r="5" fill="#0b1016"/>
    </g>
    <g transform="translate(730,470)">
      <circle r="70" class="dash" opacity=".5"/>
      <circle r="44" class="solid"/>
      <circle r="9" fill="#1a5cff"/>
      <ellipse rx="60" ry="7" fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.4" transform="rotate(28)"/>
      <ellipse rx="60" ry="7" fill="#fff" stroke="#1a5cff" stroke-width="1.4" transform="rotate(-28)"/>
      <circle r="5" fill="#0b1016"/>
    </g>
  </g>

  <!-- main board -->
  <rect class="solid" x="486" y="236" width="148" height="148" rx="16"/>
  <rect x="502" y="252" width="116" height="116" rx="10" fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.3" stroke-dasharray="5 5"/>
  <text class="tiny" x="560" y="294" text-anchor="middle">FLIGHT CTRL</text>
  <text class="key" x="560" y="320" text-anchor="middle">STM32</text>
  <text class="lbl" x="560" y="342" text-anchor="middle">F103C8T6</text>
  <g fill="#1a5cff">
    <rect x="514" y="362" width="8" height="8"/><rect x="530" y="362" width="8" height="8"/>
    <rect x="546" y="362" width="8" height="8"/><rect x="562" y="362" width="8" height="8"/>
  </g>

  <!-- callouts -->
  <g class="ln">
    <path d="M700 96h-64l-24 24"/><path d="M330 96h64l24 24"/>
    <path d="M700 546h-64l-24-24"/><path d="M330 546h64l24-24"/>
  </g>
  <text class="lbl" x="706" y="100">IMU 姿态解算 / MPU6050</text>
  <text class="lbl" x="324" y="100" text-anchor="end">UART · 调试链路</text>
  <text class="lbl" x="706" y="550">串级 PID（位置环 + 速度环）</text>
  <text class="lbl" x="324" y="550" text-anchor="end">PWM × 4 电机输出</text>

  <!-- dimension line -->
  <g class="ln" stroke="#9fb0c8">
    <path d="M390 578h340"/><path d="M390 572v12"/><path d="M730 572v12"/>
  </g>
  <rect x="524" y="568" width="72" height="20" fill="#f7f9fc"/>
  <text class="tiny" x="560" y="582" text-anchor="middle">340 mm</text>

  <!-- footer -->
  <line class="ln" x1="40" y1="600" x2="960" y2="600"/>
  <text class="tiny" x="40" y="616">DIAG.01 — 手柄端 / 飞控端 协同控制链路</text>
  <text class="tiny" x="960" y="616" text-anchor="end">SCALE / NTS · TOP VIEW</text>
</svg>
