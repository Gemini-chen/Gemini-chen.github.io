<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="众灵串口总线舵机 UART 协议帧格式、指令集与关节映射示意图">
  <defs>
    <pattern id="sg1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dfe6f1" stroke-width="1"/>
    </pattern>
    <pattern id="sg2" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ccd8ea" stroke-width="1"/>
    </pattern>
    <marker id="sar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#1a5cff" stroke-width="1.5"/>
    </marker>
    <style>
      .lbl{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#5a6a80;letter-spacing:.04em}
      .key{font-family:Consolas,Menlo,monospace;font-size:14px;fill:#0b1016;letter-spacing:.04em}
      .tiny{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#8c9bb0;letter-spacing:.1em}
      .ln{fill:none;stroke:#c6d2e3;stroke-width:1.2}
      .acc{fill:none;stroke:#1a5cff;stroke-width:1.6}
      .node{fill:#fff;stroke:#0b1016;stroke-width:1.8}
      .node-hi{fill:#eaf0ff;stroke:#1a5cff;stroke-width:1.8}
      .cell{fill:#fff;stroke:#1a5cff;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1000" height="620" fill="#f7f9fc"/>
  <rect width="1000" height="620" fill="url(#sg1)"/>
  <rect width="1000" height="620" fill="url(#sg2)"/>

  <text class="key" x="40" y="42">FIG.05B / UART BUS SERVO PROTOCOL</text>
  <text class="tiny" x="960" y="42" text-anchor="end">STM32 -&gt; 众灵 SERIAL BUS SERVO</text>
  <line class="ln" x1="40" y1="58" x2="960" y2="58"/>
  <g class="ln" stroke="#1a5cff"><path d="M40 30v-12h12"/><path d="M960 30v-12h-12"/></g>

  <!-- frame layout -->
  <text class="tiny" x="40" y="92">A — COMMAND FRAME / 指令帧结构</text>
  <g>
    <rect x="40" y="106" width="920" height="118" rx="8" class="node"/>
    <g class="cell">
      <rect x="58" y="136" width="104" height="56"/>
      <rect x="170" y="136" width="104" height="56"/>
      <rect x="282" y="136" width="104" height="56"/>
      <rect x="394" y="136" width="104" height="56"/>
      <rect x="506" y="136" width="180" height="56" class="node-hi"/>
      <rect x="694" y="136" width="104" height="56"/>
      <rect x="806" y="136" width="136" height="56"/>
    </g>
    <g class="key" text-anchor="middle">
      <text x="110" y="170">0xFF 0xFF</text><text x="222" y="170">ID</text>
      <text x="334" y="170">LEN</text><text x="446" y="170">CMD</text>
      <text x="596" y="170">PARAM (ANGLE / TIME)</text>
      <text x="746" y="170">CHECKSUM</text><text x="874" y="170">REPLY</text>
    </g>
    <g class="tiny" text-anchor="middle">
      <text x="110" y="204">HEADER</text><text x="222" y="204">SERVO ID</text>
      <text x="334" y="204">LENGTH</text><text x="446" y="204">OPCODE</text>
      <text x="596" y="204">TARGET POSITION</text><text x="746" y="204">SUM CHECK</text>
      <text x="874" y="204">ANGLE / STATUS</text>
    </g>
  </g>

  <!-- command set -->
  <text class="tiny" x="40" y="262">B — INSTRUCTION SET / 三类指令</text>
  <g>
    <rect x="40" y="276" width="292" height="130" rx="8" class="node-hi"/>
    <text class="key" x="58" y="304">01 / SET ANGLE</text>
    <text class="tiny" x="58" y="324">角度设置 · 按 ID 下发</text>
    <text class="lbl" x="58" y="352">ID + TARGET + SPEED</text>
    <text class="lbl" x="58" y="378">MULTI-JOINT SEQUENCE</text>
  </g>
  <g>
    <rect x="354" y="276" width="292" height="130" rx="8" class="node"/>
    <text class="key" x="372" y="304">02 / READ ANGLE</text>
    <text class="tiny" x="372" y="324">角度回读 · 周期回包</text>
    <text class="lbl" x="372" y="352">REQUEST -&gt; REPLY FRAME</text>
    <text class="lbl" x="372" y="378">APP REAL-TIME DISPLAY</text>
  </g>
  <g>
    <rect x="668" y="276" width="292" height="130" rx="8" class="node"/>
    <text class="key" x="686" y="304">03 / TORQUE OFF</text>
    <text class="tiny" x="686" y="324">力矩释放 · 示教模式</text>
    <text class="lbl" x="686" y="352">UNLOAD ALL JOINTS</text>
    <text class="lbl" x="686" y="378">MANUAL TEACH-IN</text>
  </g>

  <!-- joint map -->
  <text class="tiny" x="40" y="444">C — JOINT MAPPING / APP 摇杆到舵机 ID</text>
  <g>
    <rect x="40" y="458" width="920" height="92" rx="8" class="node"/>
    <g class="cell">
      <rect x="64" y="478" width="180" height="52"/>
      <rect x="290" y="478" width="180" height="52" class="node-hi"/>
      <rect x="516" y="478" width="180" height="52"/>
      <rect x="742" y="478" width="194" height="52" class="node-hi"/>
    </g>
    <g class="key" text-anchor="middle">
      <text x="154" y="500">J1 / BASE</text><text x="380" y="500">J2 / SHOULDER</text>
      <text x="606" y="500">J3 / ELBOW</text><text x="839" y="500">J4 / WRIST</text>
    </g>
    <g class="tiny" text-anchor="middle">
      <text x="154" y="520">ID 01 · JOYSTICK-L X</text><text x="380" y="520">ID 02 · JOYSTICK-L Y</text>
      <text x="606" y="520">ID 03 · JOYSTICK-R X</text><text x="839" y="520">ID 04 · JOYSTICK-R Y</text>
    </g>
  </g>
  <g class="acc" marker-end="url(#sar)"><path d="M40 574h920"/></g>
  <text class="tiny" x="40" y="598">STM32 PARSE → ID ROUTING → UART TX → SERVO EXECUTE → ANGLE REPLY → BT24W → APP</text>
  <text class="tiny" x="960" y="598" text-anchor="end">C / UART / FREERTOS</text>
</svg>
