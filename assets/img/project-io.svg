<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="基于 STM32F103 的 Modbus TCP/RTU 远程 IO 模块架构示意图">
  <defs>
    <pattern id="ig1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dfe6f1" stroke-width="1"/>
    </pattern>
    <pattern id="ig2" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ccd8ea" stroke-width="1"/>
    </pattern>
    <marker id="iar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#1a5cff" stroke-width="1.5"/>
    </marker>
    <style>
      .lbl{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#5a6a80;letter-spacing:.04em}
      .key{font-family:Consolas,Menlo,monospace;font-size:14px;fill:#0b1016;letter-spacing:.04em}
      .tiny{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#8c9bb0;letter-spacing:.1em}
      .ln{fill:none;stroke:#c6d2e3;stroke-width:1.2}
      .acc{fill:none;stroke:#1a5cff;stroke-width:1.6}
      .dash{fill:none;stroke:#1a5cff;stroke-width:1.5;stroke-dasharray:7 6}
      .node{fill:#fff;stroke:#0b1016;stroke-width:1.8}
      .node-hi{fill:#eaf0ff;stroke:#1a5cff;stroke-width:1.8}
    </style>
  </defs>

  <rect width="1000" height="620" fill="#f7f9fc"/>
  <rect width="1000" height="620" fill="url(#ig1)"/>
  <rect width="1000" height="620" fill="url(#ig2)"/>

  <text class="key" x="40" y="42">FIG.04 / MODBUS REMOTE I/O MODULE</text>
  <text class="tiny" x="960" y="42" text-anchor="end">REV. 2026 · STM32F103 / FREERTOS</text>
  <line class="ln" x1="40" y1="58" x2="960" y2="58"/>
  <g class="ln" stroke="#1a5cff"><path d="M40 30v-12h12"/><path d="M960 30v-12h-12"/></g>

  <text class="tiny" x="40" y="92">A — FIELD SIGNALS</text>
  <text class="tiny" x="372" y="92">B — MCU / RTOS</text>
  <text class="tiny" x="720" y="92">C — HOST LINKS</text>
  <g class="ln" stroke-dasharray="3 6"><path d="M352 76v400"/><path d="M700 76v400"/></g>

  <!-- A: field IO -->
  <g>
    <rect x="40" y="112" width="272" height="96" rx="6" class="node"/>
    <text class="key" x="58" y="140">8 × DI</text>
    <text class="tiny" x="58" y="160">BIDIRECTIONAL OPTO-ISOLATED</text>
    <g fill="#1a5cff" opacity=".75">
      <rect x="58" y="174" width="16" height="16" rx="2"/>
      <rect x="82" y="174" width="16" height="16" rx="2"/>
      <rect x="106" y="174" width="16" height="16" rx="2"/>
      <rect x="130" y="174" width="16" height="16" rx="2"/>
      <rect x="154" y="174" width="16" height="16" rx="2"/>
      <rect x="178" y="174" width="16" height="16" rx="2"/>
      <rect x="202" y="174" width="16" height="16" rx="2"/>
      <rect x="226" y="174" width="16" height="16" rx="2"/>
    </g>
  </g>
  <g>
    <rect x="40" y="224" width="272" height="96" rx="6" class="node"/>
    <text class="key" x="58" y="252">6 × DO</text>
    <text class="tiny" x="58" y="272">OPTO-ISOLATED OUTPUT / RELAY</text>
    <g fill="#fff" stroke="#1a5cff" stroke-width="1.4">
      <rect x="58" y="286" width="16" height="16" rx="2"/>
      <rect x="82" y="286" width="16" height="16" rx="2"/>
      <rect x="106" y="286" width="16" height="16" rx="2"/>
      <rect x="130" y="286" width="16" height="16" rx="2"/>
      <rect x="154" y="286" width="16" height="16" rx="2"/>
      <rect x="178" y="286" width="16" height="16" rx="2"/>
    </g>
  </g>
  <g>
    <rect x="40" y="336" width="272" height="96" rx="6" class="node"/>
    <text class="key" x="58" y="364">AI / ADS1115</text>
    <text class="tiny" x="58" y="384">16-BIT ADC VIA I2C</text>
    <path d="M58 412h34l14-20 14 34 14-26 14 12h90" class="acc" opacity=".7"/>
  </g>

  <!-- B: MCU -->
  <g>
    <rect x="372" y="112" width="308" height="320" rx="8" class="node-hi"/>
    <text class="key" x="392" y="142">STM32F103</text>
    <text class="tiny" x="392" y="162">FREERTOS / 3 TASKS</text>
    <line class="ln" x1="392" y1="176" x2="660" y2="176"/>
    <rect x="392" y="192" width="268" height="56" rx="4" fill="#fff" stroke="#1a5cff" stroke-width="1.3"/>
    <text class="lbl" x="406" y="216">T1  MODBUS RTU / TCP STACK</text>
    <text class="tiny" x="406" y="236">DUAL-PROTOCOL POLLING</text>
    <rect x="392" y="258" width="268" height="56" rx="4" fill="#fff" stroke="#1a5cff" stroke-width="1.3"/>
    <text class="lbl" x="406" y="282">T2  IO SCAN / 10 ms CYCLE</text>
    <text class="tiny" x="406" y="302">READ - MAP - EXECUTE</text>
    <rect x="392" y="324" width="268" height="56" rx="4" fill="#fff" stroke="#1a5cff" stroke-width="1.3"/>
    <text class="lbl" x="406" y="348">T3  MONITOR / WATCHDOG</text>
    <text class="tiny" x="406" y="368">FAULT RECOVERY</text>
    <rect x="392" y="392" width="268" height="24" rx="3" fill="#eaf0ff" stroke="#c6d2e3" stroke-width="1"/>
    <text class="tiny" x="406" y="408">UNIFIED REGISTER MAP  SHARED BY TCP + RTU</text>
  </g>

  <!-- C: links -->
  <g>
    <rect x="720" y="112" width="240" height="88" rx="6" class="node"/>
    <text class="key" x="738" y="140">RS485</text>
    <text class="tiny" x="738" y="160">MODBUS RTU / 120R TERM</text>
    <text class="lbl" x="738" y="184">192.168.1.168 : 502</text>
  </g>
  <g>
    <rect x="720" y="216" width="240" height="88" rx="6" class="node"/>
    <text class="key" x="738" y="244">ETHERNET</text>
    <text class="tiny" x="738" y="264">MODBUS TCP / SOCKET</text>
    <text class="lbl" x="738" y="288">STATION 1 / 3</text>
  </g>
  <g>
    <rect x="720" y="320" width="240" height="88" rx="6" class="node"/>
    <text class="key" x="738" y="348">TTL / I2C</text>
    <text class="tiny" x="738" y="368">DEBUG + EXPANSION</text>
    <text class="lbl" x="738" y="392">UART / SPI / I2C</text>
  </g>

  <!-- links -->
  <g class="acc" marker-end="url(#iar)">
    <path d="M312 160h52"/>
    <path d="M312 272h52"/>
    <path d="M312 384h52"/>
    <path d="M680 156h40"/>
    <path d="M680 260h40"/>
    <path d="M680 364h40"/>
  </g>
  <g class="dash">
    <path d="M840 200v16"/>
    <path d="M840 304v16"/>
  </g>

  <!-- bottom: dip switch -->
  <text class="tiny" x="40" y="472">D — DIP CONFIGURATION</text>
  <line class="ln" x1="40" y1="486" x2="960" y2="486"/>
  <g>
    <rect x="40" y="502" width="920" height="76" rx="6" class="node"/>
    <text class="tiny" x="58" y="526">STATION ID</text>
    <text class="tiny" x="298" y="526">BAUD RATE</text>
    <text class="tiny" x="538" y="526">120R TERMINATION</text>
    <text class="tiny" x="778" y="526">POWER / STATUS</text>
    <g fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.3">
      <rect x="58" y="540" width="22" height="20"/><rect x="86" y="540" width="22" height="20"/>
      <rect x="114" y="540" width="22" height="20"/><rect x="142" y="540" width="22" height="20"/>
      <rect x="298" y="540" width="22" height="20"/><rect x="326" y="540" width="22" height="20"/>
      <rect x="538" y="540" width="22" height="20"/><rect x="566" y="540" width="22" height="20"/>
    </g>
    <g fill="#1a5cff" opacity=".8">
      <rect x="58" y="540" width="22" height="9"/><rect x="114" y="540" width="22" height="9"/>
      <rect x="326" y="540" width="22" height="9"/><rect x="538" y="540" width="22" height="9"/>
    </g>
    <path d="M778 552h160" class="acc" marker-end="url(#iar)"/>
    <circle cx="946" cy="552" r="4" fill="#1a5cff"/>
  </g>
  <text class="tiny" x="960" y="598" text-anchor="end">8DI / 6DO / AI · TCP + RTU · 10 ms SCAN</text>
</svg>
