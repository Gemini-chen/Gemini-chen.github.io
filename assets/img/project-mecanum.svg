<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="麦克纳姆轮小车与四层控制板技术示意图">
  <defs>
    <pattern id="g1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dfe6f1" stroke-width="1"/>
    </pattern>
    <pattern id="g2" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ccd8ea" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1a5cff" stroke-width="1.2" opacity=".45"/>
    </pattern>
    <style>
      .lbl{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#5a6a80;letter-spacing:.04em}
      .key{font-family:Consolas,Menlo,monospace;font-size:14px;fill:#0b1016;letter-spacing:.06em}
      .tiny{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#8c9bb0;letter-spacing:.12em}
      .ln{fill:none;stroke:#c6d2e3;stroke-width:1.2}
      .acc{fill:none;stroke:#1a5cff;stroke-width:1.6}
      .dash{fill:none;stroke:#1a5cff;stroke-width:1.5;stroke-dasharray:7 6}
      .solid{fill:#fff;stroke:#0b1016;stroke-width:2}
    </style>
  </defs>

  <rect width="1000" height="620" fill="#f7f9fc"/>
  <rect width="1000" height="620" fill="url(#g1)"/>
  <rect width="1000" height="620" fill="url(#g2)"/>

  <text class="key" x="40" y="42">FIG.02 / MECANUM MOBILE PLATFORM</text>
  <text class="tiny" x="960" y="42" text-anchor="end">REV. 2025.10 · STM32F407</text>
  <line class="ln" x1="40" y1="58" x2="960" y2="58"/>
  <g class="ln" stroke="#1a5cff"><path d="M40 30v-12h12"/><path d="M960 30v-12h-12"/></g>

  <!-- receiver -->
  <rect class="solid" x="46" y="238" width="158" height="104" rx="14"/>
  <rect x="62" y="254" width="126" height="72" rx="8" fill="#f2f6fd" stroke="#dbe4f1" stroke-width="1.2"/>
  <text class="key" x="125" y="284" text-anchor="middle">富斯 i6</text>
  <text class="tiny" x="125" y="306" text-anchor="middle">SBUS RECEIVER</text>
  <circle cx="80" cy="270" r="4" fill="#1a5cff"/>
  <text class="lbl" x="46" y="226">SBUS 低延迟遥控指令</text>
  <path class="dash" d="M212 270 Q258 270 288 300"/>
  <path class="dash" d="M212 298 Q264 308 288 320" opacity=".5"/>
  <path class="dash" d="M212 326 Q264 338 288 340" opacity=".28"/>

  <!-- chassis -->
  <rect class="solid" x="292" y="146" width="416" height="336" rx="26"/>
  <rect x="312" y="166" width="376" height="296" rx="18" fill="none" stroke="#1a5cff" stroke-width="1.3" stroke-dasharray="6 6" opacity=".55"/>
  <rect x="420" y="242" width="160" height="144" rx="12" fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.6"/>
  <text class="tiny" x="500" y="282" text-anchor="middle">MAIN CTRL BOARD</text>
  <text class="key" x="500" y="308" text-anchor="middle">STM32F407</text>
  <text class="lbl" x="500" y="332" text-anchor="middle">FreeRTOS</text>
  <g fill="#1a5cff"><rect x="446" y="354" width="8" height="8"/><rect x="462" y="354" width="8" height="8"/><rect x="478" y="354" width="8" height="8"/><rect x="494" y="354" width="8" height="8"/></g>

  <!-- CAN bus -->
  <line class="acc" x1="316" y1="212" x2="684" y2="212"/>
  <g fill="#1a5cff"><circle cx="356" cy="212" r="5"/><circle cx="644" cy="212" r="5"/></g>
  <line class="acc" x1="316" y1="416" x2="684" y2="416"/>
  <g fill="#1a5cff"><circle cx="356" cy="416" r="5"/><circle cx="644" cy="416" r="5"/></g>
  <g class="ln" stroke-dasharray="4 5"><path d="M356 212v-30M644 212v-30M356 416v34M644 416v34"/></g>
  <rect x="446" y="192" width="108" height="18" fill="#f7f9fc"/>
  <text class="tiny" x="500" y="206" text-anchor="middle">CAN BUS · CMD / FDB</text>

  <!-- wheels -->
  <g>
    <g transform="translate(280,196) rotate(45)">
      <rect x="-24" y="-52" width="48" height="104" rx="12" class="solid"/>
      <rect x="-24" y="-52" width="48" height="104" rx="12" fill="url(#hatch)"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#1a5cff" stroke-width="1.2"/>
    </g>
    <g transform="translate(720,196) rotate(-45)">
      <rect x="-24" y="-52" width="48" height="104" rx="12" class="solid"/>
      <rect x="-24" y="-52" width="48" height="104" rx="12" fill="url(#hatch)"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#1a5cff" stroke-width="1.2"/>
    </g>
    <g transform="translate(280,432) rotate(-45)">
      <rect x="-24" y="-52" width="48" height="104" rx="12" class="solid"/>
      <rect x="-24" y="-52" width="48" height="104" rx="12" fill="url(#hatch)"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#1a5cff" stroke-width="1.2"/>
    </g>
    <g transform="translate(720,432) rotate(45)">
      <rect x="-24" y="-52" width="48" height="104" rx="12" class="solid"/>
      <rect x="-24" y="-52" width="48" height="104" rx="12" fill="url(#hatch)"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#1a5cff" stroke-width="1.2"/>
    </g>
  </g>
  <text class="lbl" x="292" y="120">麦轮 × 4 · 全向移动</text>
  <line class="ln" x1="292" y1="126" x2="292" y2="146"/>

  <!-- pcb layer stack -->
  <text class="lbl" x="762" y="132">四层板分层策略</text>
  <line class="ln" x1="762" y1="138" x2="762" y2="156"/>
  <g>
    <rect x="762" y="164" width="176" height="46" rx="6" fill="#fff" stroke="#0b1016" stroke-width="1.6"/>
    <text class="tiny" x="776" y="192">L1 — SIGNAL</text>
    <rect x="774" y="218" width="176" height="46" rx="6" fill="#eef3fb" stroke="#0b1016" stroke-width="1.6"/>
    <text class="tiny" x="788" y="246">L2 — GND</text>
    <rect x="786" y="272" width="176" height="46" rx="6" fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.6"/>
    <text class="tiny" x="800" y="300">L3 — POWER</text>
    <rect x="798" y="326" width="176" height="46" rx="6" fill="#fff" stroke="#0b1016" stroke-width="1.6"/>
    <text class="tiny" x="812" y="354">L4 — SIGNAL</text>
  </g>
  <path class="ln" d="M708 314h40"/>
  <path class="ln" d="M748 314v-40h14"/>
  <text class="tiny" x="762" y="396">外层走信号 / 内层走电源</text>

  <!-- bottom callouts -->
  <line class="ln" x1="40" y1="530" x2="960" y2="530"/>
  <text class="lbl" x="40" y="556">运动学逆解 → 四轮转速</text>
  <text class="lbl" x="500" y="556" text-anchor="middle">编码器反馈 + PID 闭环</text>
  <text class="lbl" x="960" y="556" text-anchor="end">Robot Master · CAN 驱动</text>
  <line class="ln" x1="40" y1="580" x2="960" y2="580"/>
  <text class="tiny" x="40" y="600">DIAG.02 — 模块化硬件架构 · 四层控制板 + 专用电源板</text>
  <text class="tiny" x="960" y="600" text-anchor="end">SCALE / NTS · TOP VIEW</text>
</svg>
