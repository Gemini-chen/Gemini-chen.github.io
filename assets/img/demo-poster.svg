<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="ROS2 避障小车实机演示视频封面">
  <defs>
    <pattern id="g1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="g2" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ffffff" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a5cff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#1a5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6f9dff" stroke-width="1.2" stroke-opacity=".55"/>
    </pattern>
    <style>
      .m{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#c7d6f0;letter-spacing:.14em}
      .ms{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#8fa4c6;letter-spacing:.16em}
      .mb{font-family:Consolas,Menlo,monospace;font-size:15px;fill:#ffffff;letter-spacing:.12em}
      .ln{fill:none;stroke:#6f9dff;stroke-width:1.4;stroke-opacity:.55}
      .dash{fill:none;stroke:#7fb0ff;stroke-width:2;stroke-dasharray:9 9;stroke-opacity:.85}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0b1016"/>
  <rect width="1280" height="720" fill="url(#g1)"/>
  <rect width="1280" height="720" fill="url(#g2)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#4d84ff" stroke-width="1.6" stroke-opacity=".9">
    <path d="M28 62V28h34"/><path d="M1252 62V28h-34"/>
    <path d="M28 658v34h34"/><path d="M1252 658v34h-34"/>
  </g>
  <rect x="46" y="46" width="1188" height="628" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <!-- top bar -->
  <circle cx="70" cy="86" r="5" fill="#ff4d5e"/>
  <text class="mb" x="88" y="91">REC</text>
  <text class="m" x="146" y="91">ROS2 / OBSTACLE AVOIDANCE · FIELD TEST</text>
  <text class="ms" x="1210" y="91" text-anchor="end">CAM 01 · 1280 × 720 · H.264 / AAC</text>
  <line x1="46" y1="110" x2="1234" y2="110" stroke="#ffffff" stroke-opacity=".14"/>

  <!-- map / obstacles -->
  <g fill="none" stroke="#6f9dff" stroke-opacity=".38" stroke-width="1.2">
    <rect x="196" y="196" width="86" height="86" rx="6"/>
    <rect x="806" y="196" width="86" height="86" rx="6"/>
    <rect x="292" y="446" width="86" height="86" rx="6"/>
    <rect x="960" y="430" width="86" height="86" rx="6"/>
  </g>
  <g fill="url(#hatch)" opacity=".55">
    <rect x="196" y="196" width="86" height="86" rx="6"/>
    <rect x="806" y="196" width="86" height="86" rx="6"/>
    <rect x="292" y="446" width="86" height="86" rx="6"/>
    <rect x="960" y="430" width="86" height="86" rx="6"/>
  </g>
  <text class="ms" x="196" y="186">OBS.01</text>
  <text class="ms" x="806" y="186">OBS.02</text>
  <text class="ms" x="292" y="546">OBS.03</text>
  <text class="ms" x="960" y="530">OBS.04</text>

  <!-- planned path -->
  <path class="dash" d="M120 600 C 300 600, 300 350, 470 342 S 660 388, 782 320 S 1010 214, 1160 250"/>
  <g fill="#7fb0ff">
    <circle cx="470" cy="342" r="4"/><circle cx="782" cy="320" r="4"/><circle cx="1160" cy="250" r="6"/>
  </g>

  <!-- robot chassis (top view) -->
  <g transform="translate(430,300)">
    <rect x="0" y="0" width="180" height="120" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#9dc0ff" stroke-width="1.8"/>
    <rect x="16" y="16" width="148" height="88" rx="8" fill="none" stroke="#9dc0ff" stroke-opacity=".45" stroke-dasharray="5 6"/>
    <rect x="62" y="38" width="56" height="44" rx="6" fill="#1a5cff" fill-opacity=".35" stroke="#9dc0ff"/>
    <circle cx="90" cy="60" r="7" fill="#ffffff"/>
    <g fill="#9dc0ff"><rect x="-14" y="12" width="14" height="34" rx="3"/><rect x="180" y="12" width="14" height="34" rx="3"/><rect x="-14" y="74" width="14" height="34" rx="3"/><rect x="180" y="74" width="14" height="34" rx="3"/></g>
  </g>
  <!-- lidar sweep -->
  <g class="ln">
    <path d="M520 360a140 140 0 0 1 108 -136"/>
    <path d="M520 360a190 190 0 0 1 150 -184"/>
    <path d="M520 360a240 240 0 0 1 192 -232"/>
  </g>
  <text class="ms" x="646" y="176">/scan · N10 LiDAR</text>

  <!-- waypoint labels -->
  <text class="ms" x="120" y="628">START</text>
  <text class="ms" x="1160" y="238" text-anchor="end">GOAL</text>

  <!-- bottom bar -->
  <line x1="46" y1="640" x2="1234" y2="640" stroke="#ffffff" stroke-opacity=".14"/>
  <text class="m" x="70" y="674">00:00:00 / 00:01:46</text>
  <text class="ms" x="640" y="674" text-anchor="middle">NAV2 · DWB LOCAL PLANNER · MULTI-LAYER COSTMAP · BEHAVIOR TREE</text>
  <text class="ms" x="1210" y="674" text-anchor="end">FIELD RECORDING / 2026</text>
</svg>
