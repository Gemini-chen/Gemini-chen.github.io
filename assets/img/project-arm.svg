<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="基于 MoveIt2 与 STM32 的机械臂运动规划及无线遥控系统架构示意图">
  <defs>
    <pattern id="ag1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dfe6f1" stroke-width="1"/>
    </pattern>
    <pattern id="ag2" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ccd8ea" stroke-width="1"/>
    </pattern>
    <marker id="aar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#1a5cff" stroke-width="1.5"/>
    </marker>
    <style>
      .lbl{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#5a6a80;letter-spacing:.04em}
      .key{font-family:Consolas,Menlo,monospace;font-size:14px;fill:#0b1016;letter-spacing:.04em}
      .tiny{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#8c9bb0;letter-spacing:.1em}
      .ln{fill:none;stroke:#c6d2e3;stroke-width:1.2}
      .acc{fill:none;stroke:#1a5cff;stroke-width:1.6}
      .dash{fill:none;stroke:#1a5cff;stroke-width:1.5;stroke-dasharray:7 6}
      .node{fill:#fff;stroke:#0b1016;stroke-width:1.8}
      .node-hi{fill:#eaf0ff;stroke:#1a5cff;stroke-width:1.8}
    </style>
  </defs>

  <rect width="1000" height="620" fill="#f7f9fc"/>
  <rect width="1000" height="620" fill="url(#ag1)"/>
  <rect width="1000" height="620" fill="url(#ag2)"/>

  <text class="key" x="40" y="42">FIG.05 / MOVEIT2 + STM32 ARM CONTROL</text>
  <text class="tiny" x="960" y="42" text-anchor="end">REV. 2026 · ROS2 / BT24W</text>
  <line class="ln" x1="40" y1="58" x2="960" y2="58"/>
  <g class="ln" stroke="#1a5cff"><path d="M40 30v-12h12"/><path d="M960 30v-12h-12"/></g>

  <text class="tiny" x="40" y="92">A — PLANNING / PC</text>
  <text class="tiny" x="386" y="92">B — WIRELESS / APP</text>
  <text class="tiny" x="716" y="92">C — EXECUTION / MCU</text>
  <g class="ln" stroke-dasharray="3 6"><path d="M366 76v400"/><path d="M696 76v400"/></g>

  <!-- A: MoveIt2 -->
  <g>
    <rect x="40" y="112" width="296" height="230" rx="8" class="node-hi"/>
    <text class="key" x="58" y="140">MoveIt2 / ROS2</text>
    <text class="tiny" x="58" y="160">URDF + SRDF / PLANNING GROUP</text>
    <line class="ln" x1="58" y1="174" x2="318" y2="174"/>
    <rect x="58" y="190" width="260" height="40" rx="4" fill="#fff" stroke="#1a5cff" stroke-width="1.2"/>
    <text class="lbl" x="70" y="216">JOINT SPACE PLANNING</text>
    <rect x="58" y="238" width="260" height="40" rx="4" fill="#fff" stroke="#1a5cff" stroke-width="1.2"/>
    <text class="lbl" x="70" y="264">CARTESIAN SPACE PLANNING</text>
    <rect x="58" y="286" width="260" height="40" rx="4" fill="#fff" stroke="#1a5cff" stroke-width="1.2"/>
    <text class="lbl" x="70" y="312">RViz / GAZEBO VERIFY</text>
  </g>
  <g>
    <rect x="40" y="360" width="296" height="72" rx="6" class="node"/>
    <text class="key" x="58" y="388">URDF MODEL</text>
    <text class="tiny" x="58" y="408">SOLIDWORKS - LINK / JOINT TREE</text>
  </g>

  <!-- B: wireless + APP -->
  <g>
    <rect x="386" y="112" width="290" height="112" rx="8" class="node"/>
    <text class="key" x="404" y="140">BT24W</text>
    <text class="tiny" x="404" y="160">WIRELESS SERIAL / UART BRIDGE</text>
    <g class="acc" marker-end="url(#aar)"><path d="M404 190h112"/></g>
    <text class="tiny" x="404" y="210">CMD PACKETS DOWNLINK</text>
  </g>
  <g>
    <rect x="386" y="240" width="290" height="192" rx="8" class="node-hi"/>
    <text class="key" x="404" y="268">APP / MULTI-MODE</text>
    <text class="tiny" x="404" y="288">REMOTE TELEOPERATION</text>
    <line class="ln" x1="404" y1="302" x2="658" y2="302"/>
    <text class="lbl" x="404" y="326">01  SINGLE JOINT CONTROL</text>
    <text class="lbl" x="404" y="352">02  DUAL JOYSTICK / 2+2 SERVOS</text>
    <text class="lbl" x="404" y="378">03  TORQUE RELEASE / TEACH</text>
    <text class="lbl" x="404" y="404">04  ANGLE FEEDBACK DISPLAY</text>
  </g>

  <!-- C: STM32 + servos -->
  <g>
    <rect x="716" y="112" width="244" height="128" rx="8" class="node"/>
    <text class="key" x="734" y="140">STM32 / FREERTOS</text>
    <text class="tiny" x="734" y="160">UART PROTOCOL ENCAPSULATION</text>
    <text class="lbl" x="734" y="188">SET ANGLE / READ ANGLE</text>
    <text class="lbl" x="734" y="212">TORQUE OFF / ID ROUTING</text>
  </g>
  <g>
    <rect x="716" y="256" width="244" height="176" rx="8" class="node-hi"/>
    <text class="key" x="734" y="284">SERIAL BUS SERVOS</text>
    <text class="tiny" x="734" y="304">ZHONGLING PROTOCOL / MULTI-ID</text>
    <line class="ln" x1="734" y1="318" x2="942" y2="318"/>
    <g fill="#fff" stroke="#1a5cff" stroke-width="1.4">
      <circle cx="758" cy="348" r="15"/><circle cx="806" cy="348" r="15"/>
      <circle cx="854" cy="348" r="15"/><circle cx="902" cy="348" r="15"/>
    </g>
    <g class="tiny" text-anchor="middle">
      <text x="758" y="352">J1</text><text x="806" y="352">J2</text>
      <text x="854" y="352">J3</text><text x="902" y="352">J4</text>
    </g>
    <path d="M734 382h208" class="acc" marker-end="url(#aar)"/>
    <text class="tiny" x="734" y="410">SHARED SERIAL BUS / ANGLE REPLY</text>
  </g>

  <!-- main flow -->
  <g class="acc" marker-end="url(#aar)">
    <path d="M336 200h44"/>
    <path d="M676 168h34"/>
    <path d="M836 240v10"/>
  </g>
  <g class="dash">
    <path d="M676 336h34"/>
    <path d="M716 336h0"/>
  </g>
  <path d="M676 336 C 700 336, 700 200, 716 200" class="dash" opacity=".7"/>

  <!-- bottom feedback loop -->
  <text class="tiny" x="40" y="472">D — CLOSED-LOOP FEEDBACK</text>
  <line class="ln" x1="40" y1="486" x2="960" y2="486"/>
  <g>
    <rect x="40" y="502" width="920" height="76" rx="6" class="node"/>
    <text class="tiny" x="58" y="526">SERVO ANGLE -&gt; STM32 PARSE -&gt; BT24W UPLINK -&gt; APP DISPLAY</text>
    <g class="acc" marker-end="url(#aar)">
      <path d="M58 552h196"/>
      <path d="M300 552h196"/>
      <path d="M542 552h196"/>
    </g>
    <g fill="#eaf0ff" stroke="#1a5cff" stroke-width="1.3">
      <rect x="270" y="542" width="16" height="20"/>
      <rect x="512" y="542" width="16" height="20"/>
      <rect x="754" y="542" width="16" height="20"/>
    </g>
    <text class="tiny" x="960" y="552" text-anchor="end">AUTO PLAN + MANUAL</text>
  </g>
  <text class="tiny" x="960" y="598" text-anchor="end">ROS2 / MOVEIT2 · URDF · BT24W · UART BUS SERVOS</text>
</svg>
